name: Stowey® Voice

# Builds the macOS app, tests it and publishes it as a release.
# Runs when the Stowey overlay changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    # `try/` branches are built and photographed but never released: nothing
    # half done can reach the download links.
    branches: [main, "try/**"]
    paths:
      - "stowey/**"
      - ".github/workflows/stowey-voice.yml"

permissions:
  contents: write

concurrency:
  group: stowey-voice-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build (${{ matrix.label }})
    # Both apps are built on GitHub's Intel Macs. Its Apple silicon Macs are
    # regularly out of capacity and cancel a job before it starts. macOS 26
    # carries the Apple Intelligence SDK the cleanup model needs, and
    # stowey/apply.py lets an Intel Mac build the Apple silicon app with it.
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: apple-silicon
          - target: x86_64-apple-darwin
            label: intel
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: stowey-macos-26-intel-${{ matrix.target }}
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      - name: Apply the Stowey overlay
        run: |
          python3 -m venv .stowey-venv
          .stowey-venv/bin/pip install --quiet pillow
          .stowey-venv/bin/python stowey/apply.py

      - name: Generate the app icon set
        run: bun run tauri icon stowey/build/app-icon.png

      - name: Build the app
        run: |
          # Packing the disk image fails now and then on GitHub's Macs, with
          # the app itself already built and signed. The compile is cached by
          # then, so another go costs a minute or two.
          for attempt in 1 2 3; do
            if bun run tauri build --target ${{ matrix.target }}; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed."
            for volume in /Volumes/Stowey*; do
              hdiutil detach "$volume" -force 2>/dev/null || true
            done
            rm -f "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"rw.*.dmg 2>/dev/null || true
            sleep 20
          done
          exit 1

      - name: Inspect the app
        run: |
          APP="$(ls -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)"
          echo "app: $APP"
          ls "$APP/Contents/MacOS"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          BIN="$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)"
          echo "binary: $BIN"
          lipo -archs "$BIN"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Signature|flags|TeamIdentifier" || true
          echo "FoundationModels linked: $(otool -L "$BIN" | grep -c FoundationModels || true)"
          # The opening words of the prompt, read from the source so this
          # check follows the prompt when it is rewritten.
          MARK="$(sed -n 's/^const PROMPT: &str = r#"\([^.]*\)\..*/\1/p' stowey/stowey.rs)"
          echo "Stowey prompt in binary: $(strings -a "$BIN" | grep -cF "$MARK" || true)"
          echo "upstream updater endpoint in bundle: $(grep -rac "cjpais/Handy/releases/latest/download/latest.json" "$APP/Contents" | awk -F: '{s+=$NF} END {print s+0}')"

      # The build machine is Intel, so only the Intel app can be started here.
      - name: Start the app once
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          APP="$(ls -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)"
          "$APP/Contents/MacOS/handy" --help

      # Nobody can look at this app from the cloud, so the build machine does:
      # it shows the pill through a hidden switch and takes a picture, once in
      # light mode and once in dark mode.
      - name: Photograph the pill
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          APP="$(ls -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)"
          mkdir -p shots
          sw_vers | tee shots/machine.txt
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E "Resolution|Retina|UI Looks" | tee -a shots/machine.txt || true
          # Something to see through the glass. The pill sits in the middle of
          # the bottom edge: left of it a white page with lines of text, right
          # of it bands of colour.
          .stowey-venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          w, h = 1920, 1080
          picture = Image.new("RGB", (w, h), "white")
          draw = ImageDraw.Draw(picture)
          for y in range(0, h, 12):
              for x in range(40, w // 2 - 6, 46):
                  draw.rectangle([x, y + 3, x + 36, y + 8], fill="black")
          colours = ["#ff5f8f", "#ffb36b", "#19e0b3", "#6fb7ff", "#7a5cff", "#101235", "#fff3c4"]
          for i, x in enumerate(range(w // 2, w, 14)):
              draw.rectangle([x, 0, x + 13, h], fill=colours[i % len(colours)])
          picture.save("shots/backdrop.png")
          PY
          osascript -e 'tell application "System Events" to tell every desktop to set picture to "'"$PWD"'/shots/backdrop.png"' || echo "could not set the desktop picture"
          sleep 4
          for mode in light dark; do
            if [ "$mode" = dark ]; then
              defaults write -g AppleInterfaceStyle Dark
            else
              defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            fi
            # As shipped while listening and while working, then the frosted
            # glass that Macs before macOS 26 get.
            for shot in listening: working: listening:frosted; do
              STOWEY_GLASS="${shot##*:}" STOWEY_SHOW_PILL="${shot%%:*}" \
                "$APP/Contents/MacOS/handy" > "shots/app-$mode-${shot%%:*}${shot##*:}.txt" 2>&1 &
              PID=$!
              sleep 13
              screencapture -x "shots/screen-$mode-${shot%%:*}${shot##*:}.png" || echo "screencapture failed for $mode $shot"
              kill "$PID" 2>/dev/null || true
              sleep 3
            done
          done
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          cp "$HOME/Library/Logs/co.stowey.voice/handy.log" shots/handy.log 2>/dev/null || true
          ls -la shots

      # The real app and a real key press: Fn and C has to put the last
      # dictation on the clipboard. Twice, once with dictation on its own two
      # keys and once with dictation on Fn alone, where the Fn of the shortcut
      # sets a dictation off first. Nothing here can fail the build: what it
      # finds is written down and read by a person.
      - name: Press the copy shortcut
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set +e
          APP="$(ls -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)"
          DATA="$HOME/Library/Application Support/co.stowey.voice"
          LOG="$HOME/Library/Logs/co.stowey.voice/handy.log"
          mkdir -p shots
          cat > press.swift <<'SWIFT'
          import CoreGraphics
          import Foundation

          // Fn down, C down, C up, Fn up, as fingers do it.
          let source = CGEventSource(stateID: .hidSystemState)
          func key(_ code: CGKeyCode, down: Bool, fn: Bool, modifier: Bool = false) {
              guard let event = CGEvent(keyboardEventSource: source, virtualKey: code, keyDown: down) else {
                  print("could not make a key event")
                  return
              }
              if modifier { event.type = .flagsChanged }
              event.flags = fn ? .maskSecondaryFn : []
              event.post(tap: .cghidEventTap)
          }
          key(63, down: true, fn: true, modifier: true)
          usleep(150_000)
          key(8, down: true, fn: true)
          usleep(60_000)
          key(8, down: false, fn: true)
          usleep(60_000)
          key(63, down: false, fn: false, modifier: true)
          print("pressed Fn and C")
          SWIFT
          swiftc -O press.swift -o press 2> shots/keys-swift.txt || echo "could not build the key presser" | tee -a shots/keys.txt
          sqlite3 "$DATA/history.db" "INSERT INTO transcription_history (file_name, timestamp, saved, title, transcription_text) VALUES ('stowey-test.wav', strftime('%s','now'), 0, 'Test', 'Stowey copy test 7341.');" \
            || echo "could not write a test dictation into the history" | tee -a shots/keys.txt
          for round in own-keys fn-alone; do
            if [ "$round" = fn-alone ]; then
              .stowey-venv/bin/python - "$DATA/settings_store.json" <<'PY' || echo "could not set dictation to Fn" | tee -a shots/keys.txt
          import json, sys
          path = sys.argv[1]
          store = json.load(open(path))
          store["settings"]["bindings"]["transcribe"]["current_binding"] = "fn"
          json.dump(store, open(path, "w"))
          print("dictation is on Fn alone now")
          PY
            fi
            printf 'nothing copied' | pbcopy
            LINES_BEFORE="$(wc -l < "$LOG" 2>/dev/null || echo 0)"
            "$APP/Contents/MacOS/handy" > "shots/app-keys-$round.txt" 2>&1 &
            PID=$!
            sleep 12
            screencapture -x "shots/screen-keys-$round-before.png" || true
            ./press | tee -a shots/keys.txt || true
            sleep 4
            screencapture -x "shots/screen-keys-$round.png" || true
            {
              echo "== $round"
              echo "clipboard: $(pbpaste)"
              # macOS opens Control Centre on Fn and C, top right. Did it here?
              .stowey-venv/bin/python - "shots/screen-keys-$round-before.png" "shots/screen-keys-$round.png" <<'PY' 2>&1
          import sys
          from PIL import Image, ImageChops
          before, after = (Image.open(path).convert("RGB") for path in sys.argv[1:3])
          w, h = before.size
          corner = (w // 2, 0, w, h // 2)
          change = ImageChops.difference(before.crop(corner), after.crop(corner)).convert("L")
          changed = sum(1 for value in change.getdata() if value > 24)
          print(f"top right quarter of the screen after the keys: {changed} of {(w - w // 2) * (h // 2)} pixels changed")
          PY
              echo "shortcuts in settings: $(.stowey-venv/bin/python -c 'import json,sys; b=json.load(open(sys.argv[1]))["settings"]["bindings"]; print({k: v["current_binding"] for k, v in b.items()})' "$DATA/settings_store.json" 2>&1)"
              echo "log since the start of this round:"
              tail -n "+$((LINES_BEFORE + 1))" "$LOG" 2>/dev/null | grep -v "Loaded settings" | grep -E "Stowey Voice|opied|Cancel|cancel|ecording|handy-keys event|icrophone|panic" | tail -40
            } | tee -a shots/keys.txt
            kill "$PID" 2>/dev/null || true
            sleep 3
          done
          cp "$LOG" shots/handy.log 2>/dev/null || true
          # An empty file cannot be attached to a release.
          find shots -type f -size 0 -delete

      - name: Keep the photographs as a build artifact
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v7
        with:
          name: stowey-voice-photographs
          path: shots/*
          retention-days: 30

      # A prerelease that carries only the photographs, so they can be fetched
      # by plain download. Deleted once they have been looked at.
      - name: Share the photographs
        if: matrix.target == 'x86_64-apple-darwin' && github.ref != 'refs/heads/main'
        run: |
          TAG="photographs-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pill photographs, run ${GITHUB_RUN_NUMBER}" \
            --notes "Screenshots from the build machine. Not an app release." \
            --prerelease || echo "Release ${TAG} already exists, adding to it."
          gh release upload "$TAG" shots/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Collect the installer
        run: |
          mkdir -p out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "out/Stowey-Voice-${{ matrix.label }}.dmg"
          ls -la out

      # A test build can be fetched and tried before it is released.
      - name: Share the test installer
        if: github.ref != 'refs/heads/main'
        run: |
          TAG="photographs-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pill photographs, run ${GITHUB_RUN_NUMBER}" \
            --notes "Screenshots from the build machine. Not an app release." \
            --prerelease || echo "Release ${TAG} already exists, adding to it."
          gh release upload "$TAG" out/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: stowey-voice-${{ matrix.label }}
          path: out/*.dmg
          retention-days: 30

      # Attached to a prerelease first. The Publish job promotes it to the
      # latest release only once both installers are there and the tests pass,
      # so the download links never point at a half finished release.
      - name: Attach to the release
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          TAG="v${VERSION}-stowey.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Stowey® Voice ${TAG}" \
            --notes-file stowey/RELEASE_NOTES.md \
            --prerelease || echo "Release ${TAG} already exists, adding to it."
          gh release upload "$TAG" out/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  test:
    name: Test the Stowey module
    runs-on: macos-26-intel
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: stowey-macos-26-intel-tests
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      - name: Apply the Stowey overlay
        run: |
          python3 -m venv .stowey-venv
          .stowey-venv/bin/pip install --quiet pillow
          .stowey-venv/bin/python stowey/apply.py

      - name: Run the tests
        working-directory: src-tauri
        run: cargo test --lib stowey

  publish:
    name: Publish
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Promote the release
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          TAG="v${VERSION}-stowey.${GITHUB_RUN_NUMBER}"
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          for NAME in Stowey-Voice-apple-silicon.dmg Stowey-Voice-intel.dmg; do
            echo "$ASSETS" | grep -qx "$NAME" || { echo "Missing ${NAME}. Not promoting ${TAG}."; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
